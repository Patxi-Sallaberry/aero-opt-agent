# ─────────────────────────────────────────────────────────────
# design_params.yaml — SEUL fichier modifié par l'agent LLM.
#
# Les 5 clés de `parameters` correspondent EXACTEMENT aux User Parameters
# du seed Fusion (fusion/seed_design.f3d). Renommer une clé ici sans la
# renommer dans Fusion fait échouer le driver en PARAM_NOT_FOUND.
#
# Les `value` reproduisent l'état du seed tel que généré (NACA 2412,
# tronçon de 80 mm, incidence nulle) : l'itération 0 doit décrire le
# modèle réel, sinon le premier delta est calculé depuis une fiction.
#
# Contrat strict (Master Doc §3.1) :
#   - value doit rester dans [min, max]
#   - |value_nouveau - value_precedent| / |value_precedent| * 100
#       <= max_delta_pct   (par rapport à la DERNIÈRE ITÉRATION RÉUSSIE)
#   - toutes les valeurs sont numériques
#
# Validation : python3 pipeline/utils.py configs/design_params.yaml
# ─────────────────────────────────────────────────────────────

iteration: 0
design_id: "wing_v01"

parameters:

  # Corde du profil. Pilote directement le nombre de Reynolds et la surface
  # de référence : max_delta modéré pour que deux itérations restent
  # comparables.
  chord:
    value: 300.0
    min: 220.0
    max: 420.0
    max_delta_pct: 7.0
    unit: "mm"

  # Épaisseur relative du profil (t/c). Sans dimension : l'expression
  # envoyée à Fusion est un nombre nu.
  # En dessous de ~0.08 le profil devient difficile à mailler et fragile
  # structurellement ; au dessus de ~0.20 la traînée de forme s'envole.
  thickness:
    value: 0.12
    min: 0.08
    max: 0.20
    max_delta_pct: 8.0
    unit: "unitless"

  # Cambrure relative (m/c), position de cambrure max fixée à p = 0.4
  # (famille NACA 24xx). Sans dimension.
  # 0.0 = profil symétrique, borne basse volontairement atteignable.
  # Au delà de ~0.09 le décollement de bord de fuite devient probable et la
  # CFD RANS stationnaire perd sa validité.
  camber:
    value: 0.02
    min: 0.0
    max: 0.09
    max_delta_pct: 10.0
    unit: "unitless"

  # Profondeur d'extrusion du tronçon d'aile (le seed est une tranche de
  # 80 mm, pas une aile complète).
  #
  # TENU FIXE, à dessein. Le calcul CFD est quasi-2D (deux plans de symétrie
  # que la géométrie traverse, cf. domain.spanwise_treatment) : l'envergure n'a
  # alors AUCUN effet sur Cd et Cl. La laisser varier ferait dépenser des
  # itérations à l'agent pour un gain nul. Les bornes ci-dessous l'immobilisent
  # sans sortir du contrat §3.1, qui exige min < max.
  # Pour la rendre réellement influente : passer domain.spanwise_treatment à
  # full_3d dans cfd_settings.yaml, puis rouvrir ces bornes.
  span:
    value: 80.0
    min: 79.0
    max: 81.0
    max_delta_pct: 1.0
    unit: "mm"

  # Angle d'incidence. Le paramètre le plus sensible : quelques degrés
  # suffisent à faire décrocher le profil. Vaut 0 dans le seed — la règle de
  # delta bascule alors sur un pourcentage de l'amplitude, soit 1.68 deg par
  # itération (voir README).
  aoa:
    value: 0.0
    min: -2.0
    max: 12.0
    max_delta_pct: 12.0
    unit: "deg"

constraints:
  topology_preserving: true
  min_wall_thickness_mm: 1.5

objectives:
  primary: "maximize_Cl_Cd"     # ou "maximize_downforce" / "minimize_Cd"
