# ─────────────────────────────────────────────────────────────
# cfd_settings.yaml — paramètres de simulation OpenFOAM.
#
# IMPORTANT : ce fichier n'est JAMAIS modifié par l'agent LLM.
# Il définit les conditions de simulation, qui doivent rester
# identiques d'une itération à l'autre pour que les comparaisons
# Cd / Cl / Cl_Cd soient valides.
#
# REPÈRE GÉOMÉTRIQUE (impose par le driver Fusion) :
#   +X = corde, du bord d'attaque vers le bord de fuite
#   +Y = épaisseur / portance
#   +Z = envergure (direction d'extrusion)
# L'incidence est portée par la GÉOMÉTRIE : le profil est tourné
# à la construction, l'écoulement reste aligné sur +X. Les
# directions de portance et de traînée ne bougent donc jamais.
# ─────────────────────────────────────────────────────────────

case:
  name: "external_aero"
  template_dir: "openfoam/templates/external_aero"
  solver: "simpleFoam"           # RANS stationnaire, incompressible
  turbulence_model: "kOmegaSST"
  wing_patch: "wing"             # nom du patch créé par snappyHexMesh

# Conditions de l'écoulement libre
flow:
  velocity_ms: 20.0              # vitesse infini amont (m/s)
  direction: [1.0, 0.0, 0.0]     # traînée = projection sur cet axe
  lift_direction: [0.0, 1.0, 0.0]
  pitch_axis: [0.0, 0.0, 1.0]    # axe d'envergure
  rho_kg_m3: 1.225               # masse volumique air (15 °C, 1 atm)
  nu_m2_s: 1.5e-5                # viscosité cinématique
  turbulent_intensity: 0.05
  turbulent_length_scale_m: 0.01

# Grandeurs de référence pour l'adimensionnement des coefficients
reference:
  # from_design : Aref = corde x envergure, lRef = corde, recalculés à CHAQUE
  #   itération depuis design_params.yaml. Indispensable — figer Aref pendant
  #   que la corde varie rendrait les Cd/Cl incomparables entre itérations.
  # fixed : utilise area_m2 / length_m ci-dessous, quelle que soit la forme.
  mode: "from_design"
  area_m2: 0.024                 # utilisé seulement si mode = fixed
  length_m: 0.30                 # utilisé seulement si mode = fixed
  # Centre de réduction des moments, en fraction de corde depuis le bord
  # d'attaque (0.25 = foyer aérodynamique classique).
  center_of_rotation_chord_fraction: 0.25

# Domaine de calcul, exprimé en multiples de la corde
domain:
  upstream_factor: 5.0
  downstream_factor: 12.0
  vertical_factor: 5.0
  # Traitement de la direction d'envergure :
  #   symmetry : quasi-2D. Le domaine occupe une tranche INTÉRIEURE à l'aile,
  #     bornée par deux plans de symétrie que la géométrie traverse de part en
  #     part. Pas de bout d'aile, donc pas de tourbillon marginal — c'est le
  #     modèle correct pour un tronçon de profil, et le moins coûteux.
  #     ATTENTION : dans ce mode, `span` n'a AUCUN effet aérodynamique (voir
  #     README) — le fixer plutôt que l'optimiser.
  #   full_3d : l'aile entière est dans le domaine, bouts compris. `span`
  #     devient réellement influent (allongement, tourbillons marginaux), au
  #     prix d'un maillage bien plus lourd.
  spanwise_treatment: "symmetry"
  # Fraction centrale de l'envergure retenue en quasi-2D.
  spanwise_fraction: 0.5
  # Marge latérale en multiples de corde, en full_3d uniquement.
  spanwise_margin_factor: 3.0

# Maillage — blockMesh puis snappyHexMesh
mesh:
  # Taille de maille de fond, en fraction de corde : le maillage suit
  # automatiquement l'échelle de la géométrie quand la corde change.
  base_cell_per_chord: 8.0
  surface_refinement_level: [3, 4]
  feature_refinement_level: 4
  feature_angle_deg: 150
  refinement_box:
    # Boîte de raffinement autour du profil et de son sillage proche,
    # en multiples de corde.
    upstream: 0.5
    downstream: 3.0
    vertical: 1.0
    level: 2
  max_local_cells: 2000000
  max_global_cells: 8000000
  boundary_layers:
    enabled: true
    n_layers: 5
    expansion_ratio: 1.2
    final_layer_thickness: 0.4
    min_thickness: 0.02
  check_mesh:
    enabled: true                # OBLIGATOIRE (Master Doc §4.3)
    fail_on_error: true
    # L'ajout de couches limites par snappyHexMesh en parallèle n'est pas
    # déterministe : sur une même géométrie, trois maillages successifs ont
    # donné 54,5 / 68,5 / 69,1 de non-orthogonalité max. Un seuil à 70 ferait
    # donc échouer une itération au hasard, et l'optimisation ne serait plus
    # reproductible. 75 reste sûr : fvSolution applique un correcteur de
    # non-orthogonalité (nNonOrthogonalCorrectors 1).
    max_non_orthogonality: 75.0
    max_skewness: 4.0
    max_aspect_ratio: 1000.0

# Contrôle du solveur
solver_control:
  start_time: 0
  end_time: 2000                 # nombre d'itérations SIMPLE
  write_interval: 500
  purge_write: 2
  max_wall_time_s: 5400          # garde-fou : abandon au-delà (1 h 30)

# Critères de convergence des résidus
convergence:
  residual_p: 1.0e-4
  residual_U: 1.0e-5
  residual_k: 1.0e-5
  residual_omega: 1.0e-5
  # Moyenne des coefficients sur les N dernières itérations
  averaging_window: 200
  # Écart-type relatif max sur la fenêtre pour déclarer la convergence
  coeff_stability_tol: 0.02

# Extraction des coefficients aérodynamiques (functionObject forceCoeffs)
force_coeffs:
  write_interval: 1
  outputs: ["Cd", "Cl", "Cl_Cd"]

# Cohérence géométrie / paramètres : la boîte englobante du STL est comparée
# à ce que design_params.yaml décrit. C'est le garde-fou qui détecte qu'une
# itération a exporté une géométrie inchangée ou erronée AVANT de dépenser
# une heure de calcul.
geometry_check:
  enabled: true
  tolerance_pct: 5.0

# Ressources d'exécution
execution:
  n_processors: 4
  decomposition_method: "scotch"
  keep_case_after_run: true      # archivage dans data/iterations/iter_XXXX/
